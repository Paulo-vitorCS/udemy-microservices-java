spring.application.name=hr-user

#Configuração Eureka
eureka.client.service-url.defaultZone=http://hr-eureka-server:8761/eureka

# Random port:
server.port=${PORT:0}
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=hr-user/create.sql